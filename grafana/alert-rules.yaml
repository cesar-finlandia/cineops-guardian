apiVersion: 1
groups:
  - orgId: 1
    name: cineops-render-queue
    folder: CineOps
    interval: 1m
    rules:
      - uid: cineops-p95-latency-high
        title: CineOps render queue max latency high — PALS
        condition: C
        data:
          - refId: A
            queryType: range
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: max(cineops_render_queue_latency_seconds{production="PALS"})
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [300] }
        annotations:
          summary: "SYNTHETIC DEMO DATA — NOT REAL: p95 render-queue latency above 300s"
        labels:
          production: PALS
          synthetic: "true"
          severity: critical
